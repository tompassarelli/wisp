name: Farm load

# Samples the farm box's load for farm-test.yml's plan job (wisp:docs/farm.md, "Where shards run"). Each run saves
# {load1, cores, at} under a new cache key; the plan job restores the newest. A busy box takes the probe late or
# never, and the plan job reads a missing or stale sample as "send the shards to hosted runners".
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One probe waits for the farm at a time; a newer one replaces the pending one.
concurrency: farm-load

jobs:
  sample:
    if: vars.FARM_RUNNER != ''
    runs-on: ${{ vars.FARM_RUNNER }}
    timeout-minutes: 2
    steps:
      - run: |
          read -r load1 _ < /proc/loadavg
          printf '{"load1":%s,"cores":%s,"at":%s}\n' "$load1" "$(nproc)" "$(date +%s)" | tee farm-load.json
      - uses: actions/cache/save@v4
        with:
          path: farm-load.json
          key: farm-load-${{ github.run_id }}
