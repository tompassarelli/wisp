name: Main is red

# Each finished CI run on main opens, updates or closes the one "main is red"
# issue (wisp:scripts/mainRed.ts). Dispatch with a run ID to report
# any branch's run, as "BRANCH is red".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: CI run ID to report
        required: true

permissions:
  actions: read
  contents: read
  issues: write

# One queue per branch: GitHub keeps one pending run per group and cancels the
# older, so a dispatched report would otherwise be lost to main's next event.
concurrency:
  group: main-red-${{ github.event.workflow_run.head_branch || inputs.run }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # CI dispatches its own report while its last job is still running.
      - if: inputs.run != ''
        run: gh run watch "${{ inputs.run }}" -i 60 > /dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: bun scripts/mainRed.ts "${{ inputs.run || github.event.workflow_run.id }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTOLAND_LOG_ISSUE: ${{ vars.AUTOLAND_LOG_ISSUE }}
