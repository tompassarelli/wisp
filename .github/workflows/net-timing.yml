name: Net timing

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Game repository holding the net command
        default: tompassarelli/wisp
      ref:
        description: Commit, branch or tag of that repository
        default: main
      directory:
        description: Folder to install and run in
        default: .
      pair:
        description: The `net pair` command without --rtt
        default: bun examples/sample/scripts/sample.ts net pair --frames 1200 --loss 0.01 --seed 5
      rtts:
        description: JSON array of round trips in ms, one job each
        default: "[0, 60, 120]"
      tag:
        description: Names the run
        default: ""

run-name: Net timing ${{ inputs.repository }}@${{ inputs.ref }} ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rtt: ${{ fromJSON(inputs.rtts) }}
    name: rtt ${{ matrix.rtt }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - env:
          PAIR: ${{ inputs.pair }}
          RTT: ${{ matrix.rtt }}
        run: |
          nproc
          set -o pipefail
          # PAIR is split into words on purpose: it is one invocation's argument list.
          $PAIR --rtt "$RTT" 2>&1 | tee "$RUNNER_TEMP/pair.txt"
          { echo "### rtt $RTT"; echo '```'; grep -E "^(host|join):" "$RUNNER_TEMP/pair.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
