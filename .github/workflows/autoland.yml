name: Autoland

# A claude/** branch (a cloud worker's) lands on main by itself: rebased onto main,
# checked, and run through the full suites (farm-test.yml); it lands when it fails
# no test main's farm run doesn't also fail. Every waiting branch is tested at
# once in its own run; only the push to main is serialized. A tip tested on a main
# that moved on its paths is not tested alone again: the queue (every waiting
# branch) is stacked on the new main and tested as one train, which lands whole
# when green and splits in halves when not, down to the tip at fault. Otherwise
# the branch stays and the run's summary names the conflicting files or the new
# failures (wisp:docs/ci.md).
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: claude/ branch to land, several separated by spaces (a train stacked on main), or queue for every waiting branch
        required: true

run-name: Autoland ${{ inputs.branch || format('{0} (push)', github.ref_name) }}

permissions:
  contents: write
  actions: write
  statuses: write

# One run per branch at a time, so branches test side by side; the land job holds
# the one landing group. A push only queues the branch, so it never waits here itself.
concurrency:
  group: ${{ github.event_name == 'push' && format('autoland-push-{0}', github.ref) || format('autoland-test-{0}', inputs.branch) }}
  cancel-in-progress: false
  queue: max

env:
  BRANCH: ${{ inputs.branch || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  WORKFLOW_REF: ${{ github.ref_name }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # A push runs the branch's copy of this file; the landing runs main's.
  queue:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh workflow run autoland.yml --ref main -f branch="$BRANCH"

  rebase:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.rebase.outputs.verdict }}
      members: ${{ steps.rebase.outputs.members }}
      deferred: ${{ steps.rebase.outputs.deferred }}
      refused: ${{ steps.rebase.outputs.refused }}
      sha: ${{ steps.rebase.outputs.sha }}
      base: ${{ steps.rebase.outputs.base }}
      scratch: ${{ steps.rebase.outputs.scratch }}
      detail: ${{ steps.rebase.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # verdict: test (the queued tips stacked on main and checked), check (the stack failed its checks) or none (no tip left to test).
      # A tip that is gone, held, refused or conflicts with main alone is settled here; one that conflicts with the stack waits in deferred.
      - id: rebase
        run: |
          set +e -uo pipefail
          trusted=$RUNNER_TEMP/checks
          cp -r host/checks "$trusted"
          . "$trusted/autolandLib.sh"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          multi() { { echo "$1<<AUTOLAND_EOF"; printf '%s\n' "$2"; echo "AUTOLAND_EOF"; } >> "$GITHUB_OUTPUT"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          base=$(git rev-parse origin/main)
          out base "$base"
          if [ "$BRANCH" = queue ]; then
            git fetch -q --prune origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
            entries=$(git for-each-ref --format='%(refname:strip=3) %(committerdate:unix)' refs/remotes/origin/claude | while read -r name age; do
              states=$(gh api "repos/$GH_REPO/commits/$(git rev-parse "origin/$name")/status" --jq '[.statuses[] | {(.context): .state}] | add // {}')
              jq -nc --arg name "$name" --argjson age "$age" --argjson ahead "$(git rev-list --count "origin/main..origin/$name")" --argjson states "$states" '{$name, $age, $ahead, $states}'
            done | jq -sc .)
            names=$(bun "$trusted/autolandTrain.ts" queue "$entries")
          else
            names=$BRANCH
          fi
          kept=()
          deferred=
          refused=0
          git checkout -q -B autoland origin/main
          for name in $names; do
            if ! git fetch -q origin "+refs/heads/$name:refs/remotes/origin/$name"; then echo "$name no longer exists" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            if [ -z "$(git rev-list "origin/main..origin/$name")" ]; then
              git push origin --delete "$name"
              echo "main already holds $name: deleted it" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            tip=$(git rev-parse "origin/$name")
            IFS=$'\t' read -r action state description <<< "$(bun "$trusted/denylist.ts" "$(gh api "repos/$GH_REPO/commits/$tip/status")")"
            if [ "$action" != test ]; then
              post_status "${state:-pending}" "$tip" "${description:-waiting for the deny-list attestation}"
              if [ "$action" = refuse ]; then
                refuse_member "$name" "$tip" "$description." ""
                refused=$((refused + 1))
              else
                echo "$name (${tip:0:10}): ${description:-waiting for the deny-list attestation}; a later dispatch tries it again" >> "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi
            git checkout -q -B member "$tip"
            if ! git rebase -q autoland > rebase.log 2>&1; then
              files=$(git diff --name-only --diff-filter=U)
              git rebase --abort
              git checkout -q autoland
              if [ ${#kept[@]} -eq 0 ]; then
                files=${files:-$(tail -20 rebase.log)}
                refuse_member "$name" "$tip" "rebasing onto main conflicts in $(printf '%s\n' "$files" | head -10 | paste -sd, - | sed 's/,/, /g')" "$files"
                refused=$((refused + 1))
              else
                deferred+=${deferred:+ }$name
                echo "$name conflicts with the tips stacked before it; it is tested after them" >> "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi
            git checkout -q autoland
            git merge -q --ff-only member
            kept+=("$name"$'\t'"$tip")
          done
          out refused "$refused"
          out deferred "$deferred"
          if [ ${#kept[@]} -eq 0 ]; then out verdict none; exit 0; fi
          multi members "$(printf '%s\n' "${kept[@]}")"
          sha=$(git rev-parse HEAD)
          scratch="farm/autoland-${sha:0:12}"
          out sha "$sha"
          if ! bun run check > check.log 2>&1; then
            cat check.log
            out verdict check
            multi detail "$(tail -40 check.log)"
            exit 0
          fi
          if ! git push origin "HEAD:refs/heads/$scratch" > push.log 2>&1; then
            cat push.log
            out verdict check
            multi detail "$(grep -v '^remote:' push.log | tail -40)"
            exit 0
          fi
          out scratch "$scratch"
          out verdict test

  suite:
    needs: rebase
    if: needs.rebase.outputs.verdict == 'test'
    uses: ./.github/workflows/farm-test.yml
    with:
      ref: ${{ needs.rebase.outputs.sha }}

  # The CI workflow's own jobs on the rebased commit (wisp:.github/workflows/ci.yml): the window crate's cargo tests
  # on lavapipe and WARP, relay, knip, the sample journeys and the checks, so a landing never turns main's CI red.
  # The Bun suites are the farm run above.
  ci:
    needs: rebase
    if: needs.rebase.outputs.verdict == 'test'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.rebase.outputs.sha }}
      base: ${{ needs.rebase.outputs.base }}
      bun-tests: skip

  # Main's failures at the base commit, needed only when the suite failed: from
  # the newest farm result for it or one of its last 30 main ancestors (a
  # previous landing's saved summary or a `bun wisp farm test` run), else from a
  # farm run of the base itself.
  baseline:
    needs: [rebase, suite]
    if: ${{ !cancelled() && needs.rebase.outputs.verdict == 'test' && needs.suite.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      from: ${{ steps.cached.outputs.from }}
    env:
      BASE: ${{ needs.rebase.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cached
        run: |
          set +e -uo pipefail
          gh api "repos/$GH_REPO/actions/workflows/farm-test.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure") | "\(.display_title | split(" ")[2]) \(.id)"' > farm-runs.txt
          for sha in $(git rev-list --first-parent -n 30 "$BASE"); do
            run=$(gh api "repos/$GH_REPO/actions/artifacts?name=autoland-summary-$sha" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
            name=autoland-summary-$sha
            if [ -z "$run" ]; then run=$(awk -v sha="$sha" '$1 == sha { print $2; exit }' farm-runs.txt); name=farm-test-summary; fi
            if [ -n "$run" ] && gh run download "$run" -n "$name" -D baseline; then
              echo "from=$sha" >> "$GITHUB_OUTPUT"
              echo "Main's failures: the farm result of ${sha:0:10} (run $run)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
      - if: steps.cached.outputs.from == ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - if: steps.cached.outputs.from == ''
        run: |
          set +e -uo pipefail
          bun install --frozen-lockfile
          bun wisp farm test --ref "$BASE" --wait | tee farm.txt
          grep -qE '^(bun|lua32): [0-9]+ passed' farm.txt || { echo "main's farm run printed no result"; exit 1; }
          mkdir -p baseline
          jq -Rn '[inputs] | {failures: map(select(startswith("FAIL ")) | .[5:]), problems: map(select(startswith("PROBLEM ")) | .[8:])}' farm.txt > baseline/summary.json
      - if: steps.cached.outputs.from == ''
        uses: actions/upload-artifact@v4
        with:
          name: autoland-summary-${{ env.BASE }}
          path: baseline/summary.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: autoland-baseline
          path: baseline/summary.json
          retention-days: 3

  # The code-health ratchet (north harness/code-health) on the rebased commit, beside the suite: land refuses new debt.
  code-health:
    needs: rebase
    if: needs.rebase.outputs.verdict == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      detail: ${{ steps.gate.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebase.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm i -g @ast-grep/cli@0.42.1
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - run: cargo build --release --locked --bin north && echo "CODE_HEALTH_NORTH_BIN=$PWD/target/release/north" >> "$GITHUB_ENV"
        working-directory: ${{ runner.temp }}/north
      - id: gate
        env:
          BASE: ${{ needs.rebase.outputs.base }}
          SHA: ${{ needs.rebase.outputs.sha }}
        run: |
          set +e -uo pipefail
          bun "$RUNNER_TEMP/north/harness/code-health/cli.ts" gate "$BASE" "$SHA" > gate.log 2>&1
          code=$?
          cat gate.log
          case "$code" in 0) verdict=pass ;; 1) verdict=debt ;; *) verdict=error ;; esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          { echo "detail<<AUTOLAND_EOF"; tail -40 gate.log; echo "AUTOLAND_EOF"; } >> "$GITHUB_OUTPUT"
          echo "code-health gate ${BASE:0:10}..${SHA:0:10}: $verdict" >> "$GITHUB_STEP_SUMMARY"

  # Everything that can refuse or hold a tip, outside the landing queue, so a branch waiting on its suite never holds another's landing.
  judge:
    needs: [rebase, suite, baseline, code-health, ci]
    if: ${{ !cancelled() && needs.rebase.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      go: ${{ steps.judge.outputs.go }}
    env:
      VERDICT: ${{ needs.rebase.outputs.verdict }}
      BASELINE_FROM: ${{ needs.baseline.outputs.from }}
      SHA: ${{ needs.rebase.outputs.sha }}
      MEMBERS: ${{ needs.rebase.outputs.members }}
      DEFERRED: ${{ needs.rebase.outputs.deferred }}
      BASE: ${{ needs.rebase.outputs.base }}
      DETAIL: ${{ needs.rebase.outputs.detail }}
      SUITE: ${{ needs.suite.result }}
      CI_RESULT: ${{ needs.ci.result }}
      CODE_HEALTH: ${{ needs.code-health.result }}
      CODE_HEALTH_VERDICT: ${{ needs.code-health.outputs.verdict }}
      CODE_HEALTH_DETAIL: ${{ needs.code-health.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: env.VERDICT == 'test'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: farm-test-summary
          path: candidate
      - if: env.VERDICT == 'test'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autoland-baseline
          path: baseline
      - if: env.VERDICT != 'none'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - id: judge
        run: |
          set +e -uo pipefail
          . host/checks/autolandLib.sh
          mapfile -t members <<< "$MEMBERS"
          names=("${members[@]%%$'\t'*}")
          refuse() {
            for member in "${members[@]}"; do refuse_member "${member%%$'\t'*}" "${member##*$'\t'}" "$1" "$2"; done
            exit 1
          }
          # A failing train of several tips is not refused as a whole: each half is tested on its own, down to the tip at fault.
          split() {
            mapfile -t half < <(bun host/checks/autolandTrain.ts split "${names[@]}")
            { echo "Autoland's train of ${#names[@]} (${names[*]}) didn't pass: $1"; echo; printf '%s\n' "$2" | head -60
              echo; echo "Testing the halves on their own: ${half[0]} | ${half[1]}"; } >> "$GITHUB_STEP_SUMMARY"
            dispatch "${half[0]}"
            dispatch "${half[1]}"
            [ -z "$DEFERRED" ] || dispatch "$DEFERRED"
            exit 0
          }
          fail() { if [ "${#names[@]}" -gt 1 ]; then split "$@"; else refuse "$@"; fi; }
          case "$VERDICT" in
            none) exit 0 ;;
            check) fail "the checks failed:" "$(printf '```\n%s\n```' "$DETAIL")" ;;
          esac
          [ -f candidate/summary.json ] || fail "the suite run ended without a result." ""
          if [ ! -f baseline/summary.json ] && [ "$SUITE" = success ] && jq -e '.failures == [] and .problems == []' candidate/summary.json > /dev/null; then
            mkdir -p baseline && echo '{"failures":[],"problems":[]}' > baseline/summary.json
          fi
          [ -f baseline/summary.json ] || fail "main's baseline run ended without a result." ""
          # A shard that failed without naming a test is new unless main's run had one in the same suite.
          compare() {
            jq -rn --slurpfile c candidate/summary.json --slurpfile b baseline/summary.json '
              def suites: map(split(" ")[0]) | unique;
              ($c[0].failures - $b[0].failures) + [$c[0].problems[] | select((split(" ")[0]) as $s | ($b[0].problems | suites | index($s)) == null)] | .[]'
          }
          new=$(compare)
          # An ancestor's result misses whatever broke on main since; before refusing, run the base itself.
          if [ -n "$new" ] && [ "$BASELINE_FROM" != "$BASE" ]; then
            echo "New failures against ${BASELINE_FROM:0:10}'s result; running the farm on main at ${BASE:0:10}"
            (bun install --frozen-lockfile > /dev/null && bun wisp farm test --ref "$BASE" --wait | tee farm.txt)
            if grep -qE '^(bun|lua32): [0-9]+ passed' farm.txt; then
              jq -Rn '[inputs] | {failures: map(select(startswith("FAIL ")) | .[5:]), problems: map(select(startswith("PROBLEM ")) | .[8:])}' farm.txt > baseline/summary.json
              new=$(compare)
            fi
          fi
          if [ -n "$new" ]; then
            fail "$(grep -c . <<< "$new") failing that main's run passes:" "$(printf '%s\n' "$new" | sed 's/^/- /')"
          fi
          if [ "$CI_RESULT" != success ]; then
            jobs=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | startswith("ci / ")) | select(.conclusion == "failure") | [.id, .name, .html_url] | @tsv')
            detail=
            failing=
            while IFS=$'\t' read -r id name url; do
              [ -n "$id" ] || continue
              tests=$(gh api "repos/$GH_REPO/actions/jobs/$id/logs" 2> /dev/null | sed -E 's/^\xEF\xBB\xBF//; s/^[0-9T:.-]+Z //' | grep -E '^test .* \.\.\. FAILED$|^\(fail\) ' | sed -E 's/^test (.*) \.\.\. FAILED$/\1/; s/^\(fail\) //' | sort -u | head -30)
              failing+="${failing:+, }${name#ci / }${tests:+ ($(grep -c . <<< "$tests") failing: $(head -1 <<< "$tests"))}"
              detail+="- [$name]($url)"$'\n'"$(sed 's/^/    - /' <<< "$tests")"$'\n'
            done <<< "$jobs"
            fail "CI jobs failed on the rebased commit: ${failing:-$CI_RESULT}" "$detail"
          fi
          case "$CODE_HEALTH:$CODE_HEALTH_VERDICT" in
            success:pass) ;;
            success:debt) fail "it adds code-health debt:" "$(printf '```\n%s\n```' "$CODE_HEALTH_DETAIL")" ;;
            success:*) fail "the code-health gate failed to run:" "$(printf '```\n%s\n```' "$CODE_HEALTH_DETAIL")" ;;
            *) fail "the code-health gate ended without a result." "" ;;
          esac
          echo "go=true" >> "$GITHUB_OUTPUT"

  # The only serialized job: a short push of an already-judged candidate. A tip tested on a main that has since
  # moved lands only if the moved commits miss every path the tip changes (wisp:host/checks/autolandLanding.ts);
  # otherwise it is tested again on the new main, as a train of one. Nothing lands untested.
  land:
    needs: [rebase, judge]
    if: ${{ !cancelled() && needs.judge.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: autoland-land
      cancel-in-progress: false
      queue: max
    env:
      SHA: ${{ needs.rebase.outputs.sha }}
      MEMBERS: ${{ needs.rebase.outputs.members }}
      DEFERRED: ${{ needs.rebase.outputs.deferred }}
      BASE: ${{ needs.rebase.outputs.base }}
      SCRATCH: ${{ needs.rebase.outputs.scratch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: farm-test-summary
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - id: land
        run: |
          set +e -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          checks=$RUNNER_TEMP/checks
          cp -r host/checks "$checks"
          . "$checks/autolandLib.sh"
          mapfile -t members <<< "$MEMBERS"
          names=("${members[@]%%$'\t'*}")
          lanes=$(printf '%s\n' "${names[@]}" | paste -sd, - | sed 's/,/, /g')
          requeue() {
            requeue_queue
            echo "$1: the queue is tested again on the new main" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$DEFERRED" ] || dispatch "$DEFERRED"
            exit 0
          }
          refspecs=()
          for member in "${members[@]}"; do
            name=${member%%$'\t'*}
            tip=${member##*$'\t'}
            if [ "$(bun "$checks/denylist.ts" "$(gh api "repos/$GH_REPO/commits/$tip/status")")" != test ]; then
              refuse_member "$name" "$tip" "${tip:0:10} no longer carries a denylist success." ""
              [ "${#names[@]}" -eq 1 ] || requeue_queue
              exit 1
            fi
            refspecs+=("+refs/heads/$name:refs/remotes/origin/$name")
          done
          git fetch -q origin "$SCRATCH" "${refspecs[@]}" || requeue "a branch vanished or the scratch branch is gone"
          for member in "${members[@]}"; do
            [ "$(git rev-parse "origin/${member%%$'\t'*}")" = "${member##*$'\t'}" ] || requeue "${member%%$'\t'*} moved on from ${member##*$'\t'}"
          done
          candidate=$(git diff --name-only "$BASE" "$SHA")
          landed=
          pushed=
          for _ in 1 2 3; do
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" = "$BASE" ]; then
              landed=$SHA
            else
              [ "$(bun "$checks/autolandLanding.ts" "$candidate" "$(git diff --name-only "$BASE" origin/main)")" = land ] || requeue "main moved on paths $lanes changes"
              git checkout -q -B land "$SHA"
              git rebase -q origin/main || { git rebase --abort; requeue "main moved and $lanes now conflicts with it"; }
              landed=$(git rev-parse HEAD)
            fi
            listing=$(git log --format='- %h %s' "origin/main..$landed" | cut -c1-120)
            if git push origin "$landed:refs/heads/main" 2> push.log; then pushed=1; break; fi
          done
          if [ -z "$pushed" ]; then
            for member in "${members[@]}"; do refuse_member "${member%%$'\t'*}" "${member##*$'\t'}" "pushing to main failed:" "$(cat push.log)"; done
            exit 1
          fi
          for member in "${members[@]}"; do
            git push origin --force-with-lease="refs/heads/${member%%$'\t'*}:${member##*$'\t'}" --delete "${member%%$'\t'*}" || echo "::warning::couldn't delete ${member%%$'\t'*}"
          done
          [ -z "$DEFERRED" ] || dispatch "$DEFERRED"
          { echo "Landed ${#names[@]} branch(es) ($lanes) on main as ${landed:0:10} and deleted them:"; echo; printf '%s\n' "$listing"; } >> "$GITHUB_STEP_SUMMARY"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$landed" >> "$GITHUB_OUTPUT"
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          if [ "$landed" = "$SHA" ]; then echo "landed=true" >> "$GITHUB_OUTPUT"; fi
      # The landed commit's result: main's CI skips the tests it passed, and the next landing's baseline reads it.
      - if: steps.land.outputs.landed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autoland-summary-${{ env.SHA }}
          path: candidate/summary.json
          retention-days: 14
      - if: steps.land.outputs.pushed == 'true'
        env:
          LANDED: ${{ steps.land.outputs.sha }}
          LANES: ${{ steps.land.outputs.lanes }}
        run: gh api -X POST "repos/$GH_REPO/statuses/$LANDED" -f state=success -f context=autoland/branch -f description="${LANES:0:139}" > /dev/null || echo "::warning::couldn't record the landing branch on ${LANDED:0:10}"
      # Pushes made with this token start no workflows: start main's CI (main-red follows it).
      - if: steps.land.outputs.pushed == 'true'
        run: gh workflow run ci.yml --ref main || echo "::warning::couldn't start main's CI"

  cleanup:
    needs: [rebase, land]
    if: ${{ always() && needs.rebase.outputs.scratch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete "${{ needs.rebase.outputs.scratch }}" || true

  # A tip refused while the train was assembled fails the run, though the rest of the train goes on to land.
  refusals:
    needs: [rebase, land]
    if: ${{ always() && needs.rebase.outputs.refused != '' && needs.rebase.outputs.refused != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "::error title=Autoland refused tips::${{ needs.rebase.outputs.refused }} tip(s) were refused; the run's summary names each"; exit 1
