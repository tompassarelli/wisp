name: Farm test

# The full suite for one commit on free hosted runners, sharded by each test
# file's measured time (wisp:docs/farm.md). `bun wisp farm test` dispatches it
# and prints the summary the merge job uploads.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test
        default: main
      tag:
        description: Names the run so `bun wisp farm test` can find the one it dispatched
        default: ""

run-name: Farm test ${{ inputs.ref }} ${{ inputs.tag }}

permissions:
  contents: read

env:
  BUN_SHARDS: 4

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      bun: ${{ steps.plan.outputs.bun }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Every run saves its measurements under a new key; the newest restores here.
      - uses: actions/cache/restore@v4
        with:
          path: farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      - id: plan
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bun scripts/wisp/farmShards.ts plan --timings farm-timings.json --bun "$BUN_SHARDS" $(git ls-files '*.test.ts') > plan.json
          echo "bun=$(jq -c '[range(.bun | length)]' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: farm-test-plan
          path: plan.json
          retention-days: 3

  bun:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.bun) }}
    name: bun ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Install the native archive test dependency
        run: sudo apt-get update -q && sudo apt-get install -y -q libstorm-dev
      - id: lua
        uses: actions/cache@v4
        with:
          path: build/lua
          key: lua-5.3.6-32-fc5fd69bb873-${{ hashFiles('native/toward-zero.h') }}
      - name: Build Warcraft's numeric Lua runtimes
        if: steps.lua.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/lua/stock build/lua/toward-zero
          curl -fsSL https://www.lua.org/ftp/lua-5.3.6.tar.gz -o build/lua-5.3.6.tar.gz
          echo 'fc5fd69bb8736323f026672b1b7235da613d7177e72558893a0bdcd320466d60  build/lua-5.3.6.tar.gz' | sha256sum --check
          tar -xzf build/lua-5.3.6.tar.gz -C build/lua/stock
          tar -xzf build/lua-5.3.6.tar.gz -C build/lua/toward-zero
          make -C build/lua/stock/lua-5.3.6 -j4 generic MYCFLAGS=-DLUA_32BITS
          make -C build/lua/toward-zero/lua-5.3.6 -j4 generic "MYCFLAGS=-DLUA_32BITS -include $PWD/native/toward-zero.h"
      - uses: actions/download-artifact@v4
        with:
          name: farm-test-plan
      - name: Test shard ${{ matrix.shard }}
        run: |
          set +e
          bun test $(jq -r ".bun[${{ matrix.shard }}][] | \"./\" + ." plan.json) --reporter=junit --reporter-outfile=junit.xml
          code=$?
          bun scripts/wisp/farmShards.ts junit --shard ${{ matrix.shard }} --exit-code "$code" junit.xml > result.json
          exit "$code"
        env:
          CC: gcc
          STORMLIB_PREFIX: /usr
          LUA: ${{ github.workspace }}/build/lua/stock/lua-5.3.6/src/lua
          TOWARD_ZERO_LUA: ${{ github.workspace }}/build/lua/toward-zero/lua-5.3.6/src/lua
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-result-bun-${{ matrix.shard }}
          path: result.json
          retention-days: 3

  merge:
    needs: [plan, bun]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@v4
        with:
          path: farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      - uses: actions/download-artifact@v4
        with:
          pattern: farm-test-*
          path: farm
      - run: bun scripts/wisp/farmShards.ts merge --plan farm/farm-test-plan/plan.json --timings farm-timings.json --out summary.json farm/farm-test-result-*/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: farm-test-summary
          path: summary.json
          retention-days: 7
      - uses: actions/cache/save@v4
        with:
          path: farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
