name: Farm test

# The full suite for one commit on free hosted runners, sharded by each test
# file's measured time (wisp:docs/farm.md). `bun wisp farm test` dispatches it
# and prints the summary the merge job uploads.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test
        default: main
      tag:
        description: Names the run so `bun wisp farm test` can find the one it dispatched
        default: ""
  # Autoland (autoland.yml) runs the suites for a rebased branch inside its own run.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        default: ""

run-name: Farm test ${{ inputs.ref }} ${{ inputs.tag }}

permissions:
  contents: read

env:
  BUN_SHARDS: 4

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      bun: ${{ steps.plan.outputs.bun }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Every run saves its measurements under a new key; the newest restores here.
      - uses: actions/cache/restore@v4
        with:
          path: farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      - id: plan
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bun scripts/wisp/farmShards.ts plan --timings farm-timings.json --bun "$BUN_SHARDS" $(git ls-files '*.test.ts') > plan.json
          echo "bun=$(jq -c '[range(.bun | length)]' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: farm-test-plan
          path: plan.json
          retention-days: 3

  bun:
    needs: plan
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.FARM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.bun) }}
    name: bun ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Install the native archive test dependency
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update -q && sudo apt-get install -y -q libstorm-dev ripgrep
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ hashFiles('scripts/wisp/lua32.ts', 'native/toward-zero.h') }}
      - uses: actions/download-artifact@v4
        with:
          name: farm-test-plan
      - name: Test shard ${{ matrix.shard }}
        run: |
          set +e
          bun run test $(jq -r ".bun[${{ matrix.shard }}][] | \"./\" + ." plan.json) --reporter=junit --reporter-outfile=junit.xml
          code=$?
          mapfile -t farm_files < <(jq -r ".bun[${{ matrix.shard }}][]" plan.json | while IFS= read -r file; do
            if rg -q 'farmTest\(' "$file"; then echo "./$file"; fi
          done)
          if [ "${#farm_files[@]}" -gt 0 ]; then
            bun test --timeout 120000 --preload ./scripts/wisp/testCostPreload.ts -t "farm: " "${farm_files[@]}" --reporter=junit --reporter-outfile=junit-farm.xml
            farm_code=$?
            if [ "$farm_code" -ne 0 ]; then code=$farm_code; fi
          fi
          bun scripts/wisp/farmShards.ts junit --shard ${{ matrix.shard }} --exit-code "$code" junit*.xml > result.json
          exit "$code"
        env:
          CC: gcc
          STORMLIB_PREFIX: /usr
      - name: Scratch cost ceiling checks (#65)
        if: ${{ matrix.shard == 0 && !cancelled() }}
        run: |
          set -o pipefail
          scratch=$(mktemp -d .cost-proof-XXXXXX)
          trap 'rm -rf "$scratch"' EXIT
          cat > "$scratch/cheap.test.ts" <<'EOF'
          import { expect, test } from "bun:test";
          for (let i = 0; i < 10; i++) test(`[spec #65] cheap input ${i}`, () => expect(i + 1).toBeGreaterThan(i));
          EOF
          bun run test "./$scratch/cheap.test.ts"
          # CPU is reported, not gated (wisp#114): five CPU seconds pass.
          cat > "$scratch/cpu.test.ts" <<'EOF'
          import { test } from "bun:test";
          test("[spec #65] scratch test burns five CPU seconds", () => {
            const start = process.cpuUsage();
            while (true) {
              const used = process.cpuUsage(start);
              if (used.user + used.system >= 5_000_000) break;
            }
          }, 120000);
          EOF
          bun run test "./$scratch/cpu.test.ts" | tee "$scratch/cpu.log"
          rg 'cpu.test.ts [0-9.]+ s' "$scratch/cpu.log"
          # A test over the frame ceiling fails and names its file.
          cat > "$scratch/frames.test.ts" <<'EOF'
          import { test } from "bun:test";
          import { steppedFrames } from "../src/headless/frameCount";
          import { TEST_CEILING_FRAMES } from "../scripts/wisp/testCost";
          test("[spec #65] scratch test steps one frame over the ceiling", () => {
            steppedFrames.count += TEST_CEILING_FRAMES + 1;
          });
          EOF
          set +e
          bun run test "./$scratch/frames.test.ts" > "$scratch/frames.log" 2>&1
          code=$?
          set -e
          cat "$scratch/frames.log"
          test "$code" -eq 1
          rg 'frames.test.ts: this test stepped 80001 headless frames, over the 80000-frame ceiling per test; shrink it or move it to the farm' "$scratch/frames.log"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-result-bun-${{ matrix.shard }}
          path: result.json
          retention-days: 3

  merge:
    needs: [plan, bun]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@v4
        with:
          path: farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      - uses: actions/download-artifact@v4
        with:
          pattern: farm-test-*
          path: farm
      - run: bun scripts/wisp/farmShards.ts merge --plan farm/farm-test-plan/plan.json --timings farm-timings.json --out summary.json farm/farm-test-result-*/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: farm-test-summary
          path: summary.json
          retention-days: 7
      - uses: actions/cache/save@v4
        with:
          path: farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
