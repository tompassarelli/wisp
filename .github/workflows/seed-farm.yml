# The seed farm (wisp:docs/ci-command.md, "Seed farm"): random soak seeds on the
# newest main every hour, each failing match filed as an issue holding its
# seed, commit and a replay command that works from a fresh clone. A game
# calls it from its own workflow:
#   uses: tompassarelli/wisp/.github/workflows/seed-farm.yml@<wisp commit>
#   with: { command: bun scripts/game.ts }
# and grants `issues: write`.
name: Seed farm

on:
  # MUTANT:seed-farm scratch only: this session can't dispatch, so a push here starts the 1-minute run.
  push:
    branches: [scratch/seed-farm-desync]
  workflow_call:
    inputs:
      command:
        description: The command that runs the game's ci (its `ci` and `repro` commands)
        type: string
        default: bun scripts/wisp/repo.ts
      minutes:
        description: Minutes of random seeds (ci nightly --minutes)
        type: number
        default: 10
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to farm; empty is the dispatched branch
        type: string
        default: ""
      minutes:
        description: Minutes of random seeds (ci nightly --minutes)
        type: number
        default: 10

permissions:
  contents: read
  issues: write

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # One run at a time per repository: a new run cancels nothing and waits
    # behind the running one; GitHub keeps one waiting run, so they never stack.
    concurrency:
      group: seed-farm-${{ github.repository }}
      cancel-in-progress: false
    env:
      COMMAND: ${{ inputs.command || 'bun scripts/wisp/repo.ts' }}
      MINUTES: ${{ inputs.minutes || (github.event_name == 'push' && 1) || 10 }}
      ARTIFACT: seed-farm-${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('scripts/wisp/lua32.ts', 'native/toward-zero.h') }}
      - name: Build Warcraft's numeric Lua runtimes
        run: |
          lua32=scripts/wisp/lua32.ts
          [ -f node_modules/wisp/scripts/wisp/lua32.ts ] && lua32=node_modules/wisp/scripts/wisp/lua32.ts
          echo "LUA=$(bun "$lua32" stock)" >> "$GITHUB_ENV"
          echo "TOWARD_ZERO_LUA=$(bun "$lua32" toward-zero)" >> "$GITHUB_ENV"
      - id: nightly
        name: Random seeds
        run: |
          mkdir -p "$RUNNER_TEMP/seed-farm"
          set +e
          $COMMAND ci nightly --minutes "$MINUTES" --json > "$RUNNER_TEMP/seed-farm/ci.jsonl"
          code=$?
          set -e
          cat "$RUNNER_TEMP/seed-farm/ci.jsonl"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
      # One issue per distinct title, at most five per run; each title's first
      # failing match is the one filed, and its repro files go in the artifact.
      - name: Choose the matches to file
        run: |
          out="$RUNNER_TEMP/seed-farm"
          mkdir -p "$out/artifact"
          : > "$out/chosen.tsv"
          jq -r 'select(.type == "result" and .stage == "nightly") | (.repros // [])[]' "$out/ci.jsonl" > "$out/repros.txt"
          while IFS= read -r repro; do
            [ -f "$repro" ] || continue
            # The repro file's first finding: its kind, and its first clause with numbers as N, so seeds dedupe.
            title=$(jq -r '.findings[0] | "seed farm: nightly: \(.kind): \(.text | split("\n")[0] | split(",")[0] | gsub("[0-9]+"; "N") | .[0:80])"' "$repro")
            awk -F'\t' -v title="$title" '$1 == title { seen = 1 } END { exit !seen }' "$out/chosen.tsv" && continue
            [ "$(wc -l < "$out/chosen.tsv")" -ge 5 ] && break
            path=$(realpath --relative-to=. "$repro")
            printf '%s\t%s\t%s\n' "$title" "$path" "$(jq -r '.match.seed' "$repro")" >> "$out/chosen.tsv"
            mkdir -p "$out/artifact/$(dirname "$path")"
            cp "${repro%.json}".* "${repro%.json}"-p*.txt "$out/artifact/$(dirname "$path")/" 2>/dev/null || true
          done < "$out/repros.txt"
          cat "$out/chosen.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/seed-farm/artifact
          if-no-files-found: ignore
          retention-days: 30
      - name: File issues
        run: |
          out="$RUNNER_TEMP/seed-farm"
          commit=$(git rev-parse HEAD)
          label=()
          [ -n "$(gh label list --limit 200 --json name -q '.[] | select(.name == "bug") | .name')" ] && label=(--label bug)
          while IFS=$'\t' read -r title path seed; do
            replay="git checkout $commit && bun install --frozen-lockfile && $COMMAND repro $path"
            download="gh run download ${{ github.run_id }} -R $GH_REPO -n $ARTIFACT"
            existing=$(gh issue list --state open --search "\"$title\" in:title" --limit 50 --json number,title | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
            if [ -n "$existing" ]; then
              printf 'Failed again in [run %s](%s).\n\n- Seed: %s\n- Commit: %s\n- Repro: `%s`, in artifact `%s`\n\n```sh\n%s\n%s\n```\n' \
                "${{ github.run_id }}" "$RUN_URL" "$seed" "$commit" "$path" "$ARTIFACT" "$download" "$replay" > "$out/comment.md"
              gh issue comment "$existing" --body-file "$out/comment.md"
            else
              body="${path%.json}.issue.md"
              printf '\n## Replay from a fresh clone\n\nFiled by the seed farm, [run %s](%s). The repro is in that run'"'"'s artifact `%s`; in a fresh clone of %s:\n\n```sh\n%s\n%s\n```\n\nThe replay exits 0 when the repro still fails with the recorded kind of finding.\n' \
                "${{ github.run_id }}" "$RUN_URL" "$ARTIFACT" "$GH_REPO" "$download" "$replay" >> "$body"
              gh issue create --title "$title" --body-file "$body" "${label[@]}"
            fi
          done < "$out/chosen.tsv"
      - name: Fail when a seed failed
        if: steps.nightly.outputs.exit != '0'
        run: exit "${{ steps.nightly.outputs.exit }}"
