name: CI

on:
  pull_request:
  push:
    # `bun wisp farm`'s scratch branches run only the workflow it dispatches.
    branches-ignore: ["farm/**"]
  # Autoland's pushes to main start no workflows, so it dispatches this one.
  workflow_dispatch:

permissions:
  contents: read

# The account runs 20 jobs at once across every repository. One run per ref
# finishes; a newer push replaces only the queued run, so the newest commit is
# always the next verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Install the native archive test dependency
        run: sudo apt-get update && sudo apt-get install -y libstorm-dev
      - run: CC=gcc STORMLIB_PREFIX=/usr bun run test

  # Tests marked farmTest (wisp:docs/testing.md "Test cost"): too heavy for
  # `bun run test`'s per-test CPU ceiling, so they run here on every push.
  # Only their files load: Bun 1.3.13 fails some CommonJS requires when every
  # file loads under -t.
  farm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Install the native archive test dependency
        run: sudo apt-get update && sudo apt-get install -y libstorm-dev
      - run: |
          CC=gcc STORMLIB_PREFIX=/usr bun test --timeout 120000 --preload ./scripts/wisp/testCostPreload.ts -t "farm: " $(git grep -l 'farmTest(' -- '*.test.ts' | sed 's#^#./#')

  # The consumer template (wisp:docs/ci.md) on the neutral sample: its checks
  # and headless journey pass, and its desync fixture fails as expected.
  sample:
    uses: ./.github/workflows/consumer.yml
    with:
      bun-version: 1.3.13
      test: bun test examples/sample
      headless: bun examples/sample/scripts/sample.ts headless
      artifact-name: wisp-ci-sample

  sample-failing-fixture:
    uses: ./.github/workflows/consumer.yml
    with:
      bun-version: 1.3.13
      check: ""
      test: ""
      lua: false
      headless: bun examples/sample/test/fixtures/desync-sample.ts headless
      expect-failure: true
      artifact-name: wisp-ci-sample-failing-fixture

  # Autoland dispatches this workflow after a landing, and a dispatched run
  # starts no workflow_run, so it hands its own result to "Main is red".
  main-red:
    needs: [framework, farm-tests, sample, sample-failing-fixture]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
