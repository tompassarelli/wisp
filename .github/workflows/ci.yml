name: CI

on:
  pull_request:
  push:
    # `bun wisp farm`'s scratch branches run only the workflow it dispatches.
    branches-ignore: ["farm/**"]
  # Autoland's pushes to main start no workflows, so it dispatches this one.
  workflow_dispatch:

permissions:
  contents: read

# The account runs 20 jobs at once across every repository. One run per ref
# finishes; a newer push replaces only the queued run, so the newest commit is
# always the next verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # `bun wisp ci post-merge` (wisp:docs/ci-command.md): the type check, the whole
  # `bun run test` and the tests marked farmTest (wisp:docs/testing.md "Test cost"),
  # which are too heavy for `bun run test`'s per-test ceilings.
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun scripts/cleanRoom.ts
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - run: bun "$RUNNER_TEMP/north/agent-machinery/scripts/effect-kit.mjs" check
      - name: Install the native archive test dependency
        run: sudo apt-get update && sudo apt-get install -y libstorm-dev
      - run: CC=gcc STORMLIB_PREFIX=/usr bun wisp ci post-merge

  # The consumer template (wisp:docs/ci.md) on the neutral sample: its checks
  # and headless journey pass, and its desync fixture fails as expected.
  sample:
    uses: ./.github/workflows/consumer.yml
    with:
      bun-version: 1.3.13
      test: bun run test examples/sample
      headless: bun examples/sample/scripts/sample.ts headless
      artifact-name: wisp-ci-sample

  sample-failing-fixture:
    uses: ./.github/workflows/consumer.yml
    with:
      bun-version: 1.3.13
      check: ""
      test: ""
      lua: false
      headless: bun examples/sample/test/fixtures/desync-sample.ts headless
      expect-failure: true
      artifact-name: wisp-ci-sample-failing-fixture

  # Autoland dispatches this workflow after a landing, and a dispatched run
  # starts no workflow_run, so it hands its own result to "Main is red".
  main-red:
    needs: [framework, sample, sample-failing-fixture]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # The seed farm's workflow_run trigger misses dispatched runs the same way.
  seed-farm:
    needs: [framework, sample, sample-failing-fixture]
    if: ${{ success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run seed-farm.yml -R "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
