name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build Warcraft's numeric Lua runtime
        run: |
          mkdir -p build
          curl -fsSL https://www.lua.org/ftp/lua-5.3.6.tar.gz -o build/lua-5.3.6.tar.gz
          echo 'fc5fd69bb8736323f026672b1b7235da613d7177e72558893a0bdcd320466d60  build/lua-5.3.6.tar.gz' | sha256sum --check
          tar -xzf build/lua-5.3.6.tar.gz -C build
          make -C build/lua-5.3.6 -j2 generic MYCFLAGS=-DLUA_32BITS
          # The same Lua with Warcraft's rounding: raw float + - * toward zero.
          mkdir -p build/warcraft-lua
          tar -xzf build/lua-5.3.6.tar.gz -C build/warcraft-lua
          make -C build/warcraft-lua/lua-5.3.6 -j2 generic "MYCFLAGS=-DLUA_32BITS -include $PWD/native/warcraft-rounding.h"
      - run: LUA="$PWD/build/lua-5.3.6/src/lua" WARCRAFT_LUA="$PWD/build/warcraft-lua/lua-5.3.6/src/lua" bun run test
