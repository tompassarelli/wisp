name: CI

on:
  pull_request:
  push:
    # `bun wisp farm`'s scratch branches run only the workflow it dispatches; Autoland runs this on a claude/ branch's train.
    branches-ignore: ["farm/**", "claude/**"]
  # Autoland's pushes to main start no workflows, so it dispatches this one.
  workflow_dispatch:
  # Autoland (autoland.yml) runs this on the rebased candidate before it lands: `ref` is the
  # candidate, `base` the main it was rebased onto (window/ and relay/ jobs run only when the
  # diff reaches them) and `bun-tests: skip` leaves the Bun suites to its farm run.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      base:
        type: string
        default: ""
      bun-tests:
        type: string
        default: run

permissions:
  contents: read

# The account runs 20 jobs at once across every repository. One run per ref
# finishes; a newer push replaces only the queued run, so the newest commit is
# always the next verified.
concurrency:
  group: ci-${{ inputs.ref && format('call-{0}', inputs.ref) || github.ref }}
  cancel-in-progress: false

jobs:
  # `bun wisp ci post-merge` (wisp:docs/ci-command.md): the type check, the whole
  # `bun run test` and the tests marked farmTest (wisp:docs/testing.md "Test cost"),
  # which are too heavy for `bun run test`'s per-test ceilings.
  # A commit Autoland landed exactly as its farm suite passed it (artifact
  # autoland-summary-SHA, no failures) skips the tests and keeps the checks.
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun host/checks/cleanRoom.ts
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - run: bun "$RUNNER_TEMP/north/agent-machinery/scripts/effect-kit.mjs" check
      - id: tested
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.ref == '' && inputs.bun-tests != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set +e -uo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=autoland-summary-$SHA" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n "autoland-summary-$SHA" -D tested || exit 0
          if jq -e '.failures == [] and .problems == [] and (.bun.passed // 0) > 0' tested/summary.json > /dev/null; then
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "Autoland run $run passed the full farm suite on ${SHA:0:10}: tests skipped, checks kept." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.tested.outputs.run != '' || inputs.bun-tests == 'skip'
        run: bun run check
      - name: Install the native archive test dependency
        if: steps.tested.outputs.run == '' && inputs.bun-tests != 'skip'
        timeout-minutes: 18
        uses: ./.github/actions/apt-install
        with:
          packages: libstorm-dev
      - if: steps.tested.outputs.run == '' && inputs.bun-tests != 'skip'
        run: CC=gcc STORMLIB_PREFIX=/usr bun wisp ci post-merge

  # The consumer template (wisp:docs/ci.md) on the neutral sample: its checks
  # and headless journey pass, and its desync fixture fails as expected.
  sample:
    uses: ./.github/workflows/consumer.yml
    with:
      ref: ${{ inputs.ref }}
      bun-version: 1.3.13
      test: bun run test examples/sample
      headless: bun examples/sample/scripts/sample.ts headless
      artifact-name: wisp-ci-sample

  sample-failing-fixture:
    uses: ./.github/workflows/consumer.yml
    with:
      ref: ${{ inputs.ref }}
      bun-version: 1.3.13
      check: ""
      test: ""
      lua: false
      headless: bun examples/sample/test/fixtures/desync-sample.ts headless
      expect-failure: true
      artifact-name: wisp-ci-sample-failing-fixture

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx knip@6.38.0

  # Which native jobs a call reaches (a push, pull request or main run with no `base` runs them all): the
  # window crate and relay have no inputs outside their folders and the workflow files.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      window: ${{ steps.scope.outputs.window }}
      relay: ${{ steps.scope.outputs.relay }}
    steps:
      - if: inputs.base != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ inputs.base }}
        run: |
          changed=
          if [ -n "$BASE" ]; then changed=$(git diff --name-only "$BASE" HEAD); fi
          reaches() { [ -z "$BASE" ] || grep -qE "^(\.github/|$1/)" <<< "$changed" && echo true || echo false; }
          echo "window=$(reaches window)" >> "$GITHUB_OUTPUT"
          echo "relay=$(reaches relay)" >> "$GITHUB_OUTPUT"

  relay-proto:
    needs: scope
    if: needs.scope.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: cargo test --locked -p relay-proto
      - run: cargo test --locked -p relay -p relay-agent

  # wisp-window (wisp:docs/native-window-plan.md, box W7): the library builds and tests, the
  # headless probe runs on lavapipe, and libwisp_window.so goes up as the wisp-window
  # artifact. Skipped while window/ does not exist.
  window:
    needs: scope
    if: needs.scope.outputs.window == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: crate
        run: echo "present=$([ -f window/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.crate.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - if: steps.crate.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.crate.outputs.present == 'true'
        timeout-minutes: 18
        uses: ./.github/actions/apt-install
        with:
          packages: libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers xvfb
      - if: steps.crate.outputs.present == 'true'
        run: cargo build --release --locked
        working-directory: window
      - if: steps.crate.outputs.present == 'true'
        run: cargo test --release --locked
        working-directory: window
      - name: Headless probe on lavapipe
        if: steps.crate.outputs.present == 'true'
        run: xvfb-run -a bun wisp window probe --frames 60 --out "$RUNNER_TEMP/window-probe"
      - name: Can bun build --compile embed the library
        if: steps.crate.outputs.present == 'true'
        run: |
          bun host/compile/windowEmbedCheck.ts window/target/release/libwisp_window.so "$RUNNER_TEMP/window-embed"
          { echo '```json'; cat "$RUNNER_TEMP/window-embed/embed.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.crate.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wisp-window
          path: |
            window/target/release/libwisp_window.so
            ${{ runner.temp }}/window-embed/embed.json
            ${{ runner.temp }}/window-probe

  # wisp-window on Windows (wisp:docs/native-window-plan.md, box W5): SDL3 builds from source
  # for the pads, and the library builds and tests there as well as on Linux.
  window-windows:
    needs: scope
    if: needs.scope.outputs.window == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: cargo build --release --locked
        working-directory: window
      - run: cargo test --release --locked
        working-directory: window

  # New structural debt (import cycle, layer violation, oversize file or function, rising hotspot) against structure.toml (north:harness/code-health).
  code-health:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm i -g @ast-grep/cli@0.42.1
      - run: git clone --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north"
      - run: cargo build --release --locked --bin north && echo "CODE_HEALTH_NORTH_BIN=$PWD/target/release/north" >> "$GITHUB_ENV"
        working-directory: ${{ runner.temp }}/north
      - env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then base=$BEFORE; else base=$(git merge-base origin/main HEAD); fi
          bun "$RUNNER_TEMP/north/harness/code-health/cli.ts" gate "$base" HEAD

  # Autoland dispatches this workflow after a landing, and a dispatched run
  # starts no workflow_run, so it hands its own result to "Main is red".
  main-red:
    needs: [framework, sample, sample-failing-fixture, relay-proto, window]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # The seed farm's workflow_run trigger misses dispatched runs the same way.
  seed-farm:
    needs: [framework, sample, sample-failing-fixture]
    if: ${{ success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.ref == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run seed-farm.yml -R "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
