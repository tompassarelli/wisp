name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Install the native archive test dependency
        run: sudo apt-get update && sudo apt-get install -y libstorm-dev
      - name: Build Warcraft's numeric Lua runtime
        run: |
          mkdir -p build
          curl -fsSL https://www.lua.org/ftp/lua-5.3.6.tar.gz -o build/lua-5.3.6.tar.gz
          echo 'fc5fd69bb8736323f026672b1b7235da613d7177e72558893a0bdcd320466d60  build/lua-5.3.6.tar.gz' | sha256sum --check
          tar -xzf build/lua-5.3.6.tar.gz -C build
          make -C build/lua-5.3.6 -j2 generic MYCFLAGS=-DLUA_32BITS
          # The same Lua with raw float + - * rounding toward zero (native/toward-zero.h).
          mkdir -p build/toward-zero-lua
          tar -xzf build/lua-5.3.6.tar.gz -C build/toward-zero-lua
          make -C build/toward-zero-lua/lua-5.3.6 -j2 generic "MYCFLAGS=-DLUA_32BITS -include $PWD/native/toward-zero.h"
      - run: CC=gcc STORMLIB_PREFIX=/usr LUA="$PWD/build/lua-5.3.6/src/lua" TOWARD_ZERO_LUA="$PWD/build/toward-zero-lua/lua-5.3.6/src/lua" bun run test

  # The consumer template (wisp:docs/ci.md) on the neutral sample: its checks
  # and headless journey pass, and its desync fixture fails as expected.
  sample:
    uses: ./.github/workflows/consumer.yml
    with:
      bun-version: 1.3.13
      test: bun test examples/sample
      headless: bun examples/sample/scripts/sample.ts headless
      artifact-name: wisp-ci-sample

  sample-failing-fixture:
    uses: ./.github/workflows/consumer.yml
    with:
      bun-version: 1.3.13
      check: ""
      test: ""
      lua: false
      headless: bun examples/sample/test/fixtures/desync-sample.ts headless
      expect-failure: true
      artifact-name: wisp-ci-sample-failing-fixture
