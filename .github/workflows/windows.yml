name: Windows

# The platform-neutral core on Windows with no Linux layer (wisp:docs/platforms.md).
# A separate workflow from CI, so a Windows failure doesn't open "main is red".
on:
  pull_request:
  push:
    branches-ignore: ["farm/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the committed Windows tools in native/windows/ from source with MinGW
  # and uploads them as the windows-tools artifact; fails when they differ from
  # the committed ones (wisp:docs/platforms.md).
  tools:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: gcc --version && cmake --version && command -v gcc make cmake
      - run: bun host/compile/buildWindowsTools.ts "$RUNNER_TEMP/windows-tools"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: ${{ runner.temp }}/windows-tools
      - name: The committed tools are the ones these sources build
        run: diff native/windows/manifest.json "$RUNNER_TEMP/windows-tools/manifest.json"

  # A map maker's Windows machine: only Bun, no compiler, make or nix.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Remove compilers, make and nix from PATH
        run: |
          kept=()
          IFS=: read -ra entries <<< "$PATH"
          for entry in "${entries[@]}"; do
            for tool in gcc gcc.exe cc.exe make make.exe mingw32-make.exe nix; do
              [ -e "$entry/$tool" ] && continue 2
            done
            kept+=("$entry")
          done
          echo "PATH=$(IFS=:; cygpath -wp "${kept[*]}")" >> "$GITHUB_ENV"
      - run: "! command -v gcc && ! command -v make && ! command -v nix"
      - run: bun run check
      - name: Lua32 runner
        run: |
          stock=$(bun host/compile/lua32.ts stock)
          toward_zero=$(bun host/compile/lua32.ts toward-zero)
          echo "LUA=$stock" >> "$GITHUB_ENV"
          echo "TOWARD_ZERO_LUA=$toward_zero" >> "$GITHUB_ENV"
      - name: wisp test
        run: bun run test examples/sample
      - name: The sample in 32-bit Lua
        run: |
          bun test --timeout 120000 -t "farm: .*32-bit Lua" ./examples/sample/test/path.test.ts ./examples/sample/test/headless.test.ts
      - name: wisp headless
        run: bun examples/sample/scripts/sample.ts headless
      - name: Map build
        run: bun test test/map-build.test.ts -t '^(?!.*interrupting a map step)'
      - name: The sample map from a synthetic base map
        run: |
          bun host/toolchain/syntheticBaseMap.ts build/tools/map-pack "$RUNNER_TEMP/base.w3x"
          bun examples/sample/scripts/sample.ts map build --base "$RUNNER_TEMP/base.w3x" --out "$RUNNER_TEMP/sample.w3x"
          build/tools/map-pack extract "$RUNNER_TEMP/sample.w3x" "$RUNNER_TEMP/war3map.lua"
          grep -q 'wispTs.start' "$RUNNER_TEMP/war3map.lua"
