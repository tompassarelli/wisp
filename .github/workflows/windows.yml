name: Windows

# The platform-neutral core on Windows with no Linux layer (wisp:docs/platforms.md).
# A separate workflow from CI, so a Windows failure doesn't open "main is red".
on:
  pull_request:
  push:
    branches-ignore: ["farm/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Lua32 runner
        run: |
          stock=$(bun scripts/wisp/lua32.ts stock)
          toward_zero=$(bun scripts/wisp/lua32.ts toward-zero)
          echo "LUA=$stock" >> "$GITHUB_ENV"
          echo "TOWARD_ZERO_LUA=$toward_zero" >> "$GITHUB_ENV"
      - name: wisp test
        run: bun run test examples/sample
      - name: The sample in 32-bit Lua
        run: |
          bun test --timeout 120000 --preload ./scripts/wisp/testCostPreload.ts -t "farm: .*32-bit Lua" ./examples/sample/test/path.test.ts ./examples/sample/test/headless.test.ts
      - name: wisp headless
        run: bun examples/sample/scripts/sample.ts headless
      - name: Map build and the platform boundary
        run: bun test test/map-build.test.ts test/platform-boundary.test.ts -t '^(?!.*interrupting a map step)'
