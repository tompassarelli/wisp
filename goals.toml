[[goal]]
name = "main-green"
source = "AGENTS.md: main stays green; a landing that turned a green main red is reverted after 15 minutes"
oracle = "gh issue list --repo tompassarelli/wisp --search 'in:title \"main is red\"' --state open --json title --jq '[.[] | select(.title == \"main is red\")] | length'"
unit = "issues"
max = 0
class = "contract"

[[goal]]
name = "layering"
source = "AGENTS.md: src/ never imports host/ or test/, and host code never imports test/"
oracle = "{ { rg -n \"from ['\\\"][./]*/?(host|test)/\" src || [ $? -eq 1 ]; }; { rg -n \"from ['\\\"][./]*/?test/\" host || [ $? -eq 1 ]; }; } | wc -l"
unit = "imports"
max = 0
class = "contract"

[[goal]]
name = "no-blizzard-files"
source = "README.md Principles: nothing of Blizzard's (code, art, sound, data, game scripts or in-game text) is in this repository"
oracle = "bun host/checks/cleanRoom.ts . >/dev/null 2>&1; echo $?"
max = 0
class = "contract"

[[goal]]
name = "target-debt-due"
source = "AGENTS.md: soft targets land with a Target-debt record; north docs/rationale/targets.md"
oracle = "north provenance debt --due | awk -F'\\t' '$1==\"wisp\"' | wc -l"
unit = "records"
max = 0
class = "debt"
ceiling = 5
owner = "tompassarelli/wisp#75"
revisit = "a Target-debt record sits unpaid past its trigger for a week"
