[package]
name = "wisp-window"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
ddsfile = { version = "0.6.0", default-features = false }
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga"] }
image-blp = { version = "1.2.0", default-features = false }
padbridge-model = { git = "https://github.com/tompassarelli/padbridge", rev = "126ba31e4065eef4e4025701b6cd5f4a6aaddbc2" }
pollster = "0.4"
sdl3-sys = { version = "0.7.2", default-features = false, features = ["build-from-source-static", "sdl-unix-console-build", "no-sdl-video", "no-sdl-audio", "no-sdl-gpu", "no-sdl-render", "no-sdl-camera", "no-sdl-dialog", "no-sdl-tray", "no-sdl-power"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texpresso = { version = "2.0.2", default-features = false }
wgpu = "30.0.1"
winit = "=0.30.13"

[features]
uinput = ["dep:evdev"]

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media"] }

[dev-dependencies]
image-blp-pixels = { package = "image", version = "0.24.9", default-features = false }
