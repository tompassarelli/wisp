[workspace]
resolver = "2"
members = ["wisp-window"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.clippy]
redundant_clone = "warn"
implicit_clone = "warn"
unnecessary_to_owned = "warn"
redundant_allocation = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
cloned_instead_of_copied = "warn"

[profile.release]
debug = false

[profile.release.package.wisp-window]
incremental = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
