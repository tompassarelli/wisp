[workspace]
resolver = "2"
members = ["wisp-window"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
debug = false

[profile.release.package.wisp-window]
incremental = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
